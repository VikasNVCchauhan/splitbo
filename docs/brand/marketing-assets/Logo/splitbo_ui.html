<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitBo App UI</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --primary-lime: #b6f328;
            --card-bg: #ffffff;
            --text-dark: #121212;
            --text-light: #888888;
            --text-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Phone frame setup */
        .phone-container {
            width: 393px;
            height: 852px;
            background-color: var(--bg-color);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 11px solid #2e2e2e;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-white);
        }

        /* Dynamic Island / Notch mimic */
        .notch {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 110px;
            height: 30px;
            background-color: #000;
            border-radius: 20px;
            z-index: 10;
        }

        /* Top status bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px 10px 28px;
            font-size: 14px;
            font-weight: 600;
            z-index: 5;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .icon-bar {
            width: 3px;
            background-color: white;
            border-radius: 1px;
        }

        /* App Contents */
        .header-actions {
            display: flex;
            justify-content: flex-end;
            padding: 10px 28px;
        }

        .skip-btn {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 25px;
            text-align: center;
        }

        /* Recreating the SplitBo logo using pure CSS vectors */
        .logo-container {
            width: 90px;
            height: 90px;
            position: relative;
            margin-bottom: 12px;
        }

        .logo-diagonal {
            position: absolute;
            width: 104px;
            height: 22px;
            background-color: var(--primary-lime);
            border-radius: 12px;
            top: 34px;
            left: -7px;
            transform: rotate(-45deg);
        }

        .logo-dot-top {
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: var(--primary-lime);
            border-radius: 50%;
            top: 8px;
            left: 54px;
        }

        .logo-dot-bottom {
            position: absolute;
            width: 22px;
            height: 22px;
            background-color: var(--primary-lime);
            border-radius: 50%;
            bottom: 8px;
            left: 14px;
        }

        .brand-name {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-white);
        }

        .brand-tagline {
            font-size: 16px;
            color: var(--text-light);
            margin-top: 6px;
            font-weight: 400;
        }

        /* Decorative sparks from the reference UI */
        .sparks-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
            margin-top: 15px;
        }

        .spark-left {
            position: absolute;
            left: 20px;
            top: 40px;
            width: 18px;
            height: 4px;
            background-color: var(--primary-lime);
            border-radius: 2px;
            transform: rotate(25deg);
        }
        .spark-left::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 2px;
            width: 14px;
            height: 4px;
            background-color: var(--primary-lime);
            border-radius: 2px;
            transform: rotate(-45deg);
        }

        .spark-right {
            position: absolute;
            right: 25px;
            top: 25px;
            width: 18px;
            height: 4px;
            background-color: var(--primary-lime);
            border-radius: 2px;
            transform: rotate(-35deg);
        }
        .spark-right::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 2px;
            width: 14px;
            height: 4px;
            background-color: var(--primary-lime);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        /* Mock Card Stack Layout */
        .cards-stack {
            position: absolute;
            top: 15px;
            left: 0;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .expense-card {
            background-color: var(--card-bg);
            color: var(--text-dark);
            width: 285px;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .card-1 { transform: rotate(-5deg) translateX(-15px); z-index: 3; }
        .card-2 { transform: rotate(4deg) translateX(15px); margin-top: -4px; z-index: 2; }
        .card-3 { transform: rotate(-2deg) translateX(-5px); margin-top: -4px; z-index: 1; }

        .card-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: #e0e0e0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .avatar-img-fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #7af, #b5f);
        }

        .card-details-text {
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
        }

        .card-members {
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 1px;
        }

        .mini-avatar-stack {
            display: flex;
        }
        .mini-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid white;
            background-color: #bbb;
            margin-right: -4px;
        }
        .mini-dot:nth-child(2) { background-color: #888; }
        .mini-dot:nth-child(3) { background-color: var(--primary-lime); }

        .member-count-tag {
            font-size: 10px;
            font-weight: 600;
            background-color: #f0f0f0;
            padding: 1px 4px;
            border-radius: 4px;
            margin-left: 6px;
            color: #555;
        }

        .card-right {
            text-align: right;
            display: flex;
            flex-direction: column;
        }

        .amount-sub {
            font-size: 10px;
            color: var(--text-light);
            font-weight: 500;
        }

        .amount-main {
            font-size: 14px;
            font-weight: 700;
        }

        /* Footer Controls */
        .footer-section {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 32px 45px 32px;
            text-align: center;
        }

        .footer-tagline {
            font-size: 16px;
            color: #e0e0e0;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .btn-get-started {
            width: 100%;
            background-color: var(--primary-lime);
            color: var(--text-dark);
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s ease;
            margin-bottom: 18px;
        }

        .btn-get-started:active {
            transform: scale(0.98);
        }

        .btn-sign-in {
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Home Indicator Line */
        .home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- Physical layout elements -->
        <div class="notch"></div>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <span class="time">9:41</span>
            <div class="status-icons">
                <!-- Simple mock icons using flex layout -->
                <div style="display:flex; align-items:flex-end; gap:2px; height:12px;">
                    <div class="icon-bar" style="height:4px;"></div>
                    <div class="icon-bar" style="height:6px;"></div>
                    <div class="icon-bar" style="height:9px;"></div>
                    <div class="icon-bar" style="height:12px;"></div>
                </div>
                <span style="font-size: 12px; margin-left: 2px;">5G</span>
                <div style="width:20px; height:10px; border:1px solid white; border-radius:3px; padding:1px; display:flex;">
                    <div style="width:100%; height:100%; background-color:white; border-radius:1px;"></div>
                </div>
            </div>
        </div>

        <!-- Upper Actions -->
        <div class="header-actions">
            <button class="skip-btn">Skip</button>
        </div>

        <!-- Main Branding -->
        <div class="brand-section">
            <div class="logo-container">
                <div class="logo-dot-top"></div>
                <div class="logo-diagonal"></div>
                <div class="logo-dot-bottom"></div>
            </div>
            <h1 class="brand-name">SplitBo</h1>
            <p class="brand-tagline">Split bills. Keep friends.</p>
        </div>

        <!-- Cards Deck & Graphic Sparks Section -->
        <div class="sparks-wrapper">
            <div class="spark-left"></div>
            <div class="spark-right"></div>
            
            <div class="cards-stack">
                <!-- Card 1: Dinner -->
                <div class="expense-card card-1">
                    <div class="card-left">
                        <div class="avatar">
                            <div class="avatar-img-fallback" style="background: linear-gradient(135deg, #ff9a9e, #fecfef);"></div>
                        </div>
                        <div class="card-details-text">
                            <span class="card-title">Dinner</span>
                            <div class="card-members">
                                <div class="mini-avatar-stack">
                                    <div class="mini-dot"></div>
                                    <div class="mini-dot"></div>
                                </div>
                                <span class="member-count-tag">3🗙</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-right">
                        <span class="amount-sub">₹400</span>
                        <span class="amount-main">₹2,400</span>
                    </div>
                </div>

                <!-- Card 2: Goa Trip / Custom representation -->
                <div class="expense-card card-2">
                    <div class="card-left">
                        <div class="avatar">
                            <div class="avatar-img-fallback" style="background: linear-gradient(135deg, #f6d365, #fda085);"></div>
                        </div>
                        <div class="card-details-text">
                            <span class="card-title">Trip</span>
                            <div class="card-members">
                                <div class="mini-avatar-stack">
                                    <div class="mini-dot"></div>
                                    <div class="mini-dot"></div>
                                    <div class="mini-dot"></div>
                                </div>
                                <span class="member-count-tag">4🗙</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-right">
                        <span class="amount-sub">₹700</span>
                        <span class="amount-main">₹6,300</span>
                    </div>
                </div>

                <!-- Card 3: Apartment -->
                <div class="expense-card card-3">
                    <div class="card-left">
                        <div class="avatar">
                            <div class="avatar-img-fallback" style="background: linear-gradient(135deg, #84fab0, #8fd3f4);"></div>
                        </div>
                        <div class="card-details-text">
                            <span class="card-title">Apartment</span>
                            <div class="card-members">
                                <div class="mini-avatar-stack">
                                    <div class="mini-dot"></div>
                                    <div class="mini-dot"></div>
                                </div>
                                <span class="member-count-tag">2🗙</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-right">
                        <span class="amount-sub">₹12,000</span>
                        <span class="amount-main">₹12,000</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Footer Section -->
        <div class="footer-section">
            <p class="footer-tagline">Share expenses, not stress.</p>
            <button class="btn-get-started">Get Started</button>
            <button class="btn-sign-in">Sign In</button>
        </div>

        <!-- UI Bottom Bar -->
        <div class="home-indicator"></div>
    </div>

</body>
</html>
